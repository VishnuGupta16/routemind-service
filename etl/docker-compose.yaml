services:
  grafana-lgtm:
    image: 'grafana/otel-lgtm:latest'
    ports:
      - '3000:3000'
      - '4317'
      - '4318'
  postgres:
    image: 'postgres:latest'
    environment:
      - 'POSTGRES_USER=routemind'
      - 'POSTGRES_PASSWORD=pass'
    ports:
      - '5432:5432'
    volumes:
      - './init/postgres:/docker-entrypoint-initdb.d:ro'
