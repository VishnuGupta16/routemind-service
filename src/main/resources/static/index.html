<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RouteMind — Mobility Intelligence</title>
<style>
 :root{--ink:#1c2233;--mut:#5b6478;--line:#e4e8f0;--bg:#f6f8fc;--hi:#c0392b;--md:#d98324;--ok:#1e8e5a}
 *{box-sizing:border-box} body{margin:0;font:15px/1.5 -apple-system,Segoe UI,Roboto,sans-serif;
   color:var(--ink);background:var(--bg)}
 header{background:#fff;border-bottom:1px solid var(--line);padding:14px 22px;display:flex;
   gap:14px;align-items:center;flex-wrap:wrap}
 h1{font-size:18px;margin:0} .grow{flex:1}
 select,input,button{font:inherit;padding:6px 9px;border:1px solid var(--line);border-radius:7px;background:#fff}
 button{cursor:pointer} button.p{background:var(--ink);color:#fff;border-color:var(--ink)}
 main{padding:20px 22px;max-width:1180px;margin:0 auto}
 .tabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
 .tabs button{border-radius:99px} .tabs button.on{background:var(--ink);color:#fff}
 .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:18px}
 .kpi{background:#fff;border:1px solid var(--line);border-radius:11px;padding:13px 15px}
 .kpi .n{font-size:24px;font-weight:650} .kpi .l{color:var(--mut);font-size:12px}
 .kpi .c{font-size:12px;margin-top:3px}
 .card{background:#fff;border:1px solid var(--line);border-radius:11px;padding:15px 17px;margin-bottom:12px}
 .sev{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.07em;padding:3px 9px;
   border-radius:99px;color:#fff;vertical-align:middle}
 .HIGH,.BREACH{background:var(--hi)} .MEDIUM,.AT_RISK{background:var(--md)} .LOW,.OK{background:var(--ok)}
 table{border-collapse:collapse;width:100%;font-size:13.5px}
 th,td{text-align:left;padding:8px 6px;border-bottom:1px solid #eff1f6}
 th{color:var(--mut);font-weight:600;font-size:12px}
 .mut{color:var(--mut)} .r{text-align:right}
 .empty{color:var(--mut);padding:24px;text-align:center}
</style>
</head>
<body>
<header>
  <h1>🚐 RouteMind</h1>
  <select id="persona"></select>
  <select id="bu"><option value="">All business units</option></select>
  <input type="date" id="from"><input type="date" id="to">
  <button class="p" onclick="loadAll()">Refresh</button>
  <span class="grow"></span>
  <span class="mut" id="mode"></span>
</header>

<main>
  <div class="tabs">
    <button class="on" onclick="tab('insights',this)">Insights</button>
    <button onclick="tab('metrics',this)">Metrics</button>
    <button onclick="tab('peers',this)">Peer comparison</button>
    <button onclick="tab('shifts',this)">Shift readiness</button>
    <button onclick="tab('live',this)">Predicted risk</button>
    <button onclick="tab('actions',this)">Actions</button>
    <button onclick="tab('sla',this)">SLA</button>
    <button onclick="tab('schema',this)">Schema <span id="schemaBadge"></span></button>
    <button onclick="openReport()">Report ↗</button>
  </div>
  <div id="kpis" class="kpis"></div>
  <div id="view"></div>
</main>

<script>
const api = (p) => fetch(p).then(r => r.ok ? r.json() : Promise.reject(r.status));
let cur = 'insights';
const $ = id => document.getElementById(id);
const q = () => `from=${$('from').value}&to=${$('to').value}` +
                ($('bu').value ? `&businessUnit=${encodeURIComponent($('bu').value)}` : '');

async function boot() {
  const h = await api('/api/health/data');
  const [min, max] = h.dateRange || [];
  $('to').value = max || '';
  $('from').value = max ? new Date(new Date(max) - 29*864e5).toISOString().slice(0,10) : (min||'');
  h.businessUnits.forEach(b => $('bu').add(new Option(b, b)));
  const ps = await api('/api/personas');
  ps.forEach(p => $('persona').add(new Option(p.displayName, p.id)));
  $('persona').value = 'FACILITIES_HEAD';
  const live = await api('/api/live/status');
  $('mode').textContent = `prediction: ${live.mode}`;
  schemaBadge();
  loadAll();
}

function tab(name, el) {
  cur = name;
  document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('on'));
  el.classList.add('on');
  render();
}
function openReport() {
  window.open(`/api/report/${$('persona').value}?${q()}`, '_blank');
}
async function loadAll() { await kpis(); render(); }

async function kpis() {
  const ms = await api(`/api/metrics?${q()}`);
  $('kpis').innerHTML = ms.map(m => `
    <div class="kpi">
      <div class="l">${m.displayName}</div>
      <div class="n">${fmt(m)}</div>
      <div class="c"><span class="sev ${m.status}">${m.status}</span>
        <span class="mut"> target ${m.target}${m.priorValue!=null?` · prev ${m.priorValue}`:''}</span></div>
    </div>`).join('');
}
const fmt = m => m.unit==='percent' ? m.value+'%' :
                 m.unit==='currency' ? '₹'+Math.round(m.value).toLocaleString() :
                 m.unit==='rating' ? m.value.toFixed(2)+'/5' : m.value;

async function render() {
  const v = $('view'); v.innerHTML = '<div class="empty">Loading…</div>';
  try {
    if (cur === 'insights') {
      const b = await api(`/api/insights/${$('persona').value}?${q()}&limit=6`);
      v.innerHTML = `<p class="mut">${b.displayName} — ${b.need} · ${b.cadence} · ${b.channel}</p>` +
        (b.findings.length ? b.findings.map(f => `
          <div class="card">
            <span class="sev ${f.severity}">${f.severity}</span>
            <strong> ${f.displayName}</strong> <span class="mut">· ${f.reason}</span>
            <p>${f.narrative}</p>
            <div class="mut">value <b>${f.value}</b> · target <b>${f.target}</b>
              ${f.priorValue!=null?`· previous <b>${f.priorValue}</b>`:''}</div>
            ${f.attribution?.length ? `<table><tr><th>${f.attributionDimension}</th><th class="r">share</th></tr>` +
              f.attribution.map(a=>`<tr><td>${a.member}</td><td class="r">${a.pct}%</td></tr>`).join('') +
              `</table>` : ''}
          </div>`).join('')
        : '<div class="empty">Nothing crossed the thresholds — all tracked metrics within target.</div>');
    }
    else if (cur === 'metrics') {
      const ms = await api(`/api/metrics?${q()}`);
      v.innerHTML = `<div class="card"><table>
        <tr><th>Metric</th><th class="r">Value</th><th class="r">Target</th><th class="r">Prev</th>
            <th>Status</th><th>Headline</th></tr>` +
        ms.map(m=>`<tr><td>${m.displayName}</td><td class="r"><b>${fmt(m)}</b></td>
          <td class="r">${m.target}</td><td class="r">${m.priorValue??'—'}</td>
          <td><span class="sev ${m.status}">${m.status}</span></td>
          <td class="mut">${m.headline}</td></tr>`).join('') + `</table></div>`;
    }
    else if (cur === 'shifts') {
      const day = $('to').value;
      const rows = await api(`/api/shifts?day=${day}` +
        ($('bu').value?`&businessUnit=${encodeURIComponent($('bu').value)}`:''));
      v.innerHTML = `<p class="mut">Line-manager view for ${day}</p><div class="card"><table>
        <tr><th>Shift</th><th>Office</th><th class="r">Trips</th><th class="r">Late</th>
            <th class="r">OTA</th><th class="r">Boarded</th><th class="r">Readiness</th><th>Note</th></tr>` +
        (rows.map(r=>`<tr><td>${r.shift}</td><td>${r.office}</td><td class="r">${r.trips}</td>
          <td class="r">${r.lateTrips}</td><td class="r">${r.otaPct}%</td>
          <td class="r">${r.employeesBoarded}/${r.employeesExpected}</td>
          <td class="r">${r.readinessPct}%</td><td class="mut">${r.note}</td></tr>`).join('')
          || '<tr><td colspan="8" class="empty">No trips that day.</td></tr>') + `</table></div>`;
    }
    else if (cur === 'peers') {
      const id = 'ota';
      const p = await api(`/api/metrics/${id}/peers?${q()}`);
      v.innerHTML = `<div class="card"><p><strong>${p.headline}</strong></p>
        <p class="mut">best ${p.best} · median ${p.median} · worst ${p.worst} · ${p.peerCount} business units</p>
        <table><tr><th>#</th><th>Business unit</th><th class="r">Value</th><th class="r">Sample</th></tr>` +
        p.peers.map(r=>`<tr><td>${r.rank}</td><td>${r.member}</td>
          <td class="r"><b>${r.value}</b></td><td class="r">${r.sampleSize.toLocaleString()}</td></tr>`).join('') +
        `</table></div>`;
    }
    else if (cur === 'sla') {
      const [pols, comp] = await Promise.all([
        api('/api/sla/policies'),
        api(`/api/sla/compliance?${q()}&groupBy=vendor&minTrips=500`)]);

      v.innerHTML = `
        <div class="card">
          <strong>Vendor SLAs</strong>
          <span class="mut"> — an SLA is a contract term, so it differs per vendor, cab
          type and shift. Leave a field blank to mean “any”. Most specific rule wins:
          vendor &gt; business unit &gt; cab type &gt; shift.</span>
          <table style="margin-top:10px">
            <tr><th>Name</th><th>Scope</th><th class="r">Window</th><th class="r">Target</th><th></th></tr>
            ${pols.map(p=>`<tr>
               <td>${esc(p.name)}</td><td class="mut">${esc(p.scope)}</td>
               <td class="r">${p.otaWindowMinutes} min</td>
               <td class="r">${p.otaTarget}%</td>
               <td class="r">${p.active?`<button onclick="slaDelete(${p.id})">deactivate</button>`:'<span class="mut">inactive</span>'}</td>
             </tr>`).join('')}
          </table>
        </div>

        <div class="card">
          <strong>Add SLA (vendor onboarding)</strong>
          <p>
            <input id="sName" placeholder="name e.g. Premium cab SLA" style="width:220px">
            <input id="sVendor" placeholder="vendor (blank = any)" style="width:200px">
            <input id="sBu" placeholder="business unit" style="width:150px">
            <input id="sProd" placeholder="cab type" style="width:110px">
            <input id="sShift" placeholder="shift" style="width:90px">
            <input id="sWin" type="number" value="10" style="width:70px" title="on-time window (min)">
            <input id="sTgt" type="number" value="95" step="0.5" style="width:70px" title="target %">
            <button class="p" onclick="slaCreate()">Add</button>
          </p>
        </div>

        <div class="card">
          <strong>Vendor scorecard — each judged against the SLA it signed</strong>
          <table style="margin-top:8px">
            <tr><th>Vendor</th><th class="r">Trips</th><th class="r">OTA</th>
                <th class="r">Window</th><th class="r">Target</th><th class="r">vs target</th>
                <th>Status</th><th>SLA applied</th></tr>
            ${comp.length ? comp.map(r=>`<tr>
               <td>${esc(r.vendor)}</td><td class="r">${r.trips.toLocaleString()}</td>
               <td class="r"><b>${r.otaPct}%</b></td><td class="r">${r.windowMinutes} min</td>
               <td class="r">${r.target}%</td>
               <td class="r" style="color:${r.vsTarget<0?'var(--hi)':'var(--ok)'}">${r.vsTarget>0?'+':''}${r.vsTarget}</td>
               <td><span class="sev ${r.status==='BREACH'?'HIGH':r.status==='AT_RISK'?'MEDIUM':'LOW'}">${r.status}</span></td>
               <td class="mut">${esc(r.slaName)}</td>
             </tr>`).join('')
             : '<tr><td colspan="8" class="empty">No vendors with enough trips in this period.</td></tr>'}
          </table>
        </div>`;
    }
    else if (cur === 'schema') {
      const [chs, sum] = await Promise.all([
        api('/api/schema/changes'), api('/api/schema/summary')]);
      const pending = chs.filter(c => c.state === 'PENDING');
      v.innerHTML = `<div class="card">
          <strong>Schema evolution</strong>
          <span class="mut"> — the feed changed. Decide once; adoption is backward
          compatible (column added NULLable, no backfill, history untouched).
          Proposals from: <b>${sum.advisor}</b>.</span>
        </div>` +
        (chs.length ? chs.map(c => `
          <div class="card">
            <span class="sev ${c.state==='PENDING'?'MEDIUM':c.state==='ADOPTED'?'OK':'LOW'}">${c.state}</span>
            <strong> ${c.source}.${c.column}</strong>
            <span class="mut">· ${c.type}${c.availableFrom?` · data from ${c.availableFrom}`:''}</span>
            ${c.profile ? `<div class="mut">type ${c.profile.inferredType} ·
               ${c.profile.nonNullPct}% populated · ${c.profile.distinctCount} distinct ·
               e.g. ${(c.profile.sampleValues||[]).slice(0,3).join(', ')}</div>` : ''}
            <pre style="white-space:pre-wrap;background:#f6f8fc;padding:10px;
                 border-radius:8px;font-size:13px;margin:10px 0">${esc(c.proposal||'')}</pre>
            ${c.migrationSql?`<div class="mut"><code>${esc(c.migrationSql)}</code></div>`:''}
            ${c.note?`<div class="mut">↳ ${esc(c.note)}</div>`:''}
            ${c.state==='PENDING'?`<p>
               <button class="p" onclick="schemaDecide('${c.id}','adopt')">Adopt</button>
               <button onclick="schemaDecide('${c.id}','ignore')">Ignore</button>
               <button onclick="schemaDecide('${c.id}','reject')">Reject</button></p>`:''}
          </div>`).join('')
        : '<div class="empty">No schema changes detected. Run the ETL validator and POST '
          + 'its report to /api/schema/report.</div>');
    }
    else if (cur === 'actions') {
      const acts = await api('/api/actions');
      v.innerHTML = `<div class="card">
          <button class="p" onclick="proposeActions()">Propose actions from current findings</button>
          <span class="mut"> — the system proposes, you approve. Approval records execution.</span>
        </div>` +
        (acts.length ? acts.map(a=>`
          <div class="card">
            <span class="sev ${a.state==='EXECUTED'?'OK':a.state==='REJECTED'?'LOW':'MEDIUM'}">${a.state}</span>
            <strong> ${a.displayName}</strong> <span class="mut">· ${a.target ?? ''}</span>
            <p>${a.title}</p>
            <div class="mut">${a.rationale ?? ''}</div>
            ${a.outcome?`<div class="mut">↳ ${a.outcome}</div>`:''}
            ${a.state==='PROPOSED'?`<p>
               <button class="p" onclick="decide(${a.id},'approve')">Approve</button>
               <button onclick="decide(${a.id},'reject')">Reject</button></p>`:''}
          </div>`).join('')
        : '<div class="empty">No actions yet — click “Propose actions”.</div>');
    }
    else {
      const day = $('to').value;
      const st = await api('/api/live/replay/status');
      const rows = await api(`/api/live/risk?day=${day}` +
        ($('bu').value?`&businessUnit=${encodeURIComponent($('bu').value)}`:'') + '&limit=15');
      v.innerHTML = `<div class="card">
          <strong>Live replay</strong> <span class="mut">— replays a historical day so the
          live path (ingest → fuse → alert) can be demonstrated without a GPS feed.
          Timing is real; geography is synthesised.</span><p>
          <button class="p" onclick="replay('start')">Start replay (${day})</button>
          <button onclick="replay('stop')">Stop</button>
          <span class="mut"> status: ${st.running?`running · ${st.tripsLoaded} trips · ${st.pingsEmitted} pings`:'idle'}</span>
          </p></div>
        <p class="mut">Trips predicted to run late on ${day} — act before it happens</p>
        <div class="card"><table>
        <tr><th>Risk</th><th>Vendor</th><th>Office</th><th>Shift</th><th class="r">Pred. delay</th>
            <th class="r">Staff</th><th>Why</th><th>Action</th></tr>` +
        (rows.map(r=>`<tr><td><span class="sev ${r.level}">${r.level}</span></td>
          <td>${r.vendor}</td><td>${r.office}</td><td>${r.shift}</td>
          <td class="r">${r.predictedDelayMin} min</td><td class="r">${r.employeesAffected}</td>
          <td class="mut">${r.reason}</td><td class="mut">${r.recommendedAction}</td></tr>`).join('')
          || '<tr><td colspan="8" class="empty">No risk signal for that day.</td></tr>') + `</table></div>`;
    }
  } catch (e) { v.innerHTML = `<div class="empty">Error loading (${e}). Is Postgres running?</div>`; }
}
const esc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

async function slaCreate() {
  const body = {
    name: $('sName').value || 'Unnamed SLA',
    vendor: $('sVendor').value || null,
    businessUnit: $('sBu').value || null,
    productType: $('sProd').value || null,
    shiftType: $('sShift').value || null,
    otaWindowMinutes: parseInt($('sWin').value || '10', 10),
    otaTarget: parseFloat($('sTgt').value || '95'),
    priority: 0, active: true, createdBy: 'ui'
  };
  await fetch('/api/sla/policies', {method:'POST',
    headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)});
  render();
}
async function slaDelete(id) {
  await fetch(`/api/sla/policies/${id}`, {method:'DELETE'});
  render();
}

async function schemaDecide(id, what) {
  await fetch(`/api/schema/changes/${encodeURIComponent(id)}/${what}?by=demo`, {method:'POST'});
  await schemaBadge();
  render();
}
async function schemaBadge() {
  try {
    const s = await api('/api/schema/summary');
    const p = (s.byState && s.byState.PENDING) || 0;
    $('schemaBadge').textContent = p ? ` (${p})` : '';
  } catch (e) { /* endpoint not up yet */ }
}

async function proposeActions() {
  await fetch(`/api/actions/propose?persona=${$('persona').value}&${q()}`, {method:'POST'});
  render();
}
async function decide(id, what) {
  await fetch(`/api/actions/${id}/${what}?by=demo`, {method:'POST'});
  render();
}
async function replay(what) {
  const day = $('to').value;
  const url = what === 'start'
    ? `/api/live/replay/start?day=${day}&speed=60&limit=25`
    : '/api/live/replay/stop';
  await fetch(url, {method:'POST'});
  setTimeout(render, 400);
}

// push alerts from the live layer
try {
  const es = new EventSource('/api/live/stream');
  es.addEventListener('alert', e => {
    const a = JSON.parse(e.data);
    const b = document.createElement('div');
    b.className = 'card';
    b.innerHTML = `<span class="sev HIGH">LIVE</span> <strong> Trip ${a.tripId}</strong>
      <p>${a.message}</p><div class="mut">${a.recommendedAction}</div>`;
    $('view').prepend(b);
  });
} catch (e) { /* SSE unsupported — dashboard still works */ }

boot();
</script>
</body>
</html>
