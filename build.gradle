plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.0'
}

group = 'com.routemind'
version = '0.1.0'

ext {
    springBootVersion = '4.0.0'
}

java {
    // Java 24: JEP 491 removed virtual-thread pinning in synchronized blocks,
    // which is what previously limited virtual threads under JDBC drivers.
    toolchain { languageVersion = JavaLanguageVersion.of(24) }
}

repositories { mavenCentral() }

dependencies {
    // Spring Boot 4 uses Gradle's native BOM support instead of the
    // io.spring.dependency-management plugin.
    implementation platform("org.springframework.boot:spring-boot-dependencies:${springBootVersion}")

    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.kafka:spring-kafka'   // live GPS stream
    // Notification channels. JavaMailSender is injected as an Optional, so with no SMTP
    // configured the bean is simply absent and EmailChannel reports itself unavailable —
    // the app still starts and the demo still runs end to end.
    implementation 'org.springframework.boot:spring-boot-starter-mail'

    // QA chatbot. langchain4j is the JVM port of LangChain; the OpenAI module talks to any
    // OpenAI-compatible endpoint, which is how it reaches Sarvam (custom base URL). The
    // chatbot never computes a metric — it classifies the persona and formats the answer;
    // the numbers come from the Java services. So if this dependency or the model is
    // unavailable, the chatbot degrades to a deterministic answer rather than failing.
    implementation 'dev.langchain4j:langchain4j:1.0.1'
    implementation 'dev.langchain4j:langchain4j-open-ai:1.0.1'

    runtimeOnly   'org.postgresql:postgresql'

    testImplementation platform("org.springframework.boot:spring-boot-dependencies:${springBootVersion}")
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

tasks.named('test') { useJUnitPlatform() }
